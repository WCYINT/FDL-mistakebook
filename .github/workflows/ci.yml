name: CI

on:
  push:
  pull_request:

# 时区固定为项目基准时区（Asia/Shanghai）。
# 原因：项目日期口径统一走 fdl_core.srs.time_layer.LOCAL_TZ，而测试中存在
# `date.today()` 形式的「本地今天」断言；runner 默认时区为 UTC，会让
# 「本地今天」与 LOCAL_TZ 今天在 00:00-08:00（CST）窗口内相差一天，导致
# 时区相关用例误报。固定 TZ 后本地与 CI 口径一致。
env:
  TZ: Asia/Shanghai

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 合规扫描需要完整历史

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
          pip install -e .

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: No PyTorch check
        run: bash scripts/check_no_torch.sh

      - name: Banned words scan
        run: bash scripts/check_no_banned_words.sh

      - name: Release gate (secrets / private paths / version / license)
        run: python scripts/check_release_ready.py .

      - name: Git history leak scan
        run: python scripts/check_release_ready.py . --history

      # 说明：离线审计中「字体 vendor / 模型本地化 / 日志完整性」三项面向完整本地部署
      # 环境。开源仓库按设计不包含 macOS 系统字体（版权）、ASR 模型与运行日志，
      # 故该步骤以非阻断方式运行（详见 CHANGELOG「已知事项」）。
      - name: Offline audit (NFR-1, non-blocking)
        continue-on-error: true
        run: python scripts/offline_audit.py

      - name: Unit tests (pytest)
        run: pytest
